<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Splash Republic">
  <title>Splash Republic</title>
  <!-- Light-on-dark variant for the hero, which sits over video. The lettering is
       outlined from the brand font (Space Grotesk Bold/SemiBold), so it renders
       identically and crisply on every device: an SVG used as an <img> cannot load
       web fonts, and the old system-ui text came out soft and different per phone.
       Brightened 2026-10-31 at the owner's request ("dark and dull"). -->
  <defs>
    <linearGradient id="sr-foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2FBFF"/>
      <stop offset="1" stop-color="#B8EDFF"/>
    </linearGradient>
  </defs>

  <!-- Slide flume mark, centred above the wordmark. -->
  <g transform="translate(300 8)">
    <path d="M10 44c34 0 18 52 46 52s16-40 46-40"
          fill="none" stroke="#FFFFFF" stroke-width="15"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 120c14 0 14-10 28-10s14 10 28 10 14-10 28-10 14 10 28 10"
          fill="none" stroke="#9BE7FF" stroke-width="11" stroke-linecap="round"/>
    <circle cx="102" cy="66" r="9" fill="#9BE7FF"/>
  </g>

