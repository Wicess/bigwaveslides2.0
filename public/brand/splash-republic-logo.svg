<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="Splash Republic">
  <title>Splash Republic</title>
  <defs>
    <linearGradient id="sr-logo-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#003366"/>
    </linearGradient>
  </defs>

  <!-- Mark, repeated from splash-republic-mark.svg so the wordmark is a single
       self-contained file (email clients and PDF renderers will not resolve a
       nested <use href> to another document). -->
  <rect width="64" height="64" rx="16" fill="url(#sr-logo-g)"/>
  <path d="M17 17c11 0 6 17 15 17s5-13 15-13"
        fill="none" stroke="#FFFFFF" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 46c4.5 0 4.5-3.4 9-3.4s4.5 3.4 9 3.4 4.5-3.4 9-3.4 4.5 3.4 9 3.4"
        fill="none" stroke="#7FD4FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="24" r="3" fill="#7FD4FF"/>

  <!-- Wordmark. System sans stack rather than a webfont: this file is embedded
       in emails and PDFs where a font request would silently fall back. -->
  <text x="80" y="34"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-0.5" fill="#0F172A">SPLASH</text>
  <text x="80" y="55"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" letter-spacing="5.6" fill="#0099FF">REPUBLIC</text>
</svg>
