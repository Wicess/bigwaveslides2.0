<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Splash Republic">
  <title>Splash Republic</title>
  <defs>
    <linearGradient id="sr-mark-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0099FF"/>
      <stop offset="1" stop-color="#003366"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile keeps the mark legible as a 32px favicon and as an app icon. -->
  <rect width="64" height="64" rx="16" fill="url(#sr-mark-g)"/>
  <!-- A slide flume: a single descending curve, ending in a splash. Reads as
       motion at small sizes, where a literal slide illustration turns to mud. -->
  <path d="M17 17c11 0 6 17 15 17s5-13 15-13"
        fill="none" stroke="#FFFFFF" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Water line + droplets. -->
  <path d="M13 46c4.5 0 4.5-3.4 9-3.4s4.5 3.4 9 3.4 4.5-3.4 9-3.4 4.5 3.4 9 3.4"
        fill="none" stroke="#7FD4FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="24" r="3" fill="#7FD4FF"/>
</svg>
